<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Kaleidosound</title>

    <!-- PWA: "Add to Home Screen" launches chrome-less (clean casting) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kaleidosound" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- MilkDrop (WebGL) surface -->
    <canvas id="viz" aria-label="Music visualizer"></canvas>
    <!-- Classic 2D visualizer surface -->
    <canvas id="viz2d" class="canvas-hidden" aria-label="Music visualizer"></canvas>

    <!-- Preset name / status toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- Bottom control bar (auto-hides; every control has a header) -->
    <div id="controls" class="controls" hidden>
      <div class="controls-row">
        <div class="control-group">
          <span class="ctl-label">Visual Preset</span>
          <select id="preset-select" class="tv-select" aria-label="Visual preset"></select>
        </div>

        <div class="control-group">
          <span class="ctl-label">Audio</span>
          <select id="source-select" class="tv-select" aria-label="Audio source">
            <option value="mic">Microphone</option>
            <option value="linein">Line-In</option>
          </select>
        </div>

        <div class="control-group">
          <span class="ctl-label">Device</span>
          <select id="device-select" class="tv-select" aria-label="Audio device"></select>
        </div>

        <div class="control-group">
          <span class="ctl-label">Shuffle</span>
          <button id="btn-shuffle" class="tv-btn toggle" aria-label="Shuffle presets">🔀</button>
        </div>

        <div class="control-group">
          <span class="ctl-label">Timer</span>
          <button id="btn-timer" class="tv-btn toggle active" aria-label="Auto-advance presets">⏱</button>
        </div>

        <div class="control-group">
          <span class="ctl-label">Sensitivity</span>
          <input id="sensitivity" class="tv-range" type="range" min="0.2" max="4" step="0.1" value="1" aria-label="Sensitivity" />
        </div>

        <div class="control-group">
          <span class="ctl-label">Brightness</span>
          <input id="brightness" class="tv-range" type="range" min="0.15" max="1" step="0.05" value="1" aria-label="Brightness" />
        </div>

        <div class="control-group">
          <span class="ctl-label">Full Screen</span>
          <button id="btn-fullscreen" class="tv-btn" aria-label="Toggle fullscreen">⛶</button>
        </div>
      </div>
    </div>

    <!-- Butterchurn (MilkDrop) engine + preset pack, bundled locally -->
    <script src="vendor/butterchurn.min.js"></script>
    <script src="vendor/butterchurnPresets.min.js"></script>
    <script src="vendor/isSupported.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
